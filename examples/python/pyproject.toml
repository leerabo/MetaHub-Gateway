[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "metahub-gateway-examples"
version = "0.1.0"
description = "MetaHub Gateway 的 OpenAI-compatible Python 示例"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.30,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[project.scripts]
metahub-chat-example = "metahub_gateway_examples.chat:cli"
metahub-embeddings-example = "metahub_gateway_examples.embeddings:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

