worker_processes auto;
pid /tmp/nginx.pid;
# Nginx error messages can include unredacted request URIs and headers.
# Availability is observed through health/SLO probes, not raw request logs.
error_log /dev/null crit;

events {
    worker_connections 1024;
}

http {
    # Request paths/headers may contain credentials. Do not persist them at ingress.
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 32m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    include /etc/nginx/retired-console-routes.conf;

    map $upstream_status $metahub_cache_control {
        default $upstream_http_cache_control;
        404 no-store;
    }

    upstream metahub_control {
        server control-api:8001;
        keepalive 16;
    }

    server {
        listen 8080;
        merge_slashes on;
        location / {
            if ($metahub_retired_console_route) {
                rewrite ^ /__metahub_route_not_found__? break;
            }
            # Passing the normalized URI also closes encoded-slash/dot aliases.
            # The unknown route uses the backend's ordinary 404/error contract.
            proxy_pass http://metahub_control/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_next_upstream off;
            proxy_buffering off;
            proxy_hide_header Cache-Control;
            add_header Cache-Control $metahub_cache_control always;
        }
    }
}
