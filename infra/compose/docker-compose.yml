# MetaHub 单机 Compose 编排，默认只启动可运行的 SQLite 持久化 MVP。
# PostgreSQL、Redis、MinIO 保留在 compose-full profile 中，避免当前 sqlite-only 运行时被错误切到不可用的数据库驱动。
name: ${METAHUB_COMPOSE_PROJECT:-metahub}

services:
  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    image: ${METAHUB_IMAGE_PREFIX:-metahub}/gateway:${METAHUB_IMAGE_TAG:-local}
    command: ["python", "-m", "metahub_gateway.main"]
    env_file:
      - "${METAHUB_COMPOSE_ENV_FILE:-.env.compose}"
    environment:
      PYTHONPATH: /app/shared-sdk/python:/app/gateway-data-plane/src
      METAHUB_SERVICE_NAME: metahub-gateway
    ports:
      - "${METAHUB_GATEWAY_BIND:-127.0.0.1}:${METAHUB_GATEWAY_PORT:-8000}:8000"
    volumes:
      - metahub-sqlite:/app/.data/compose
      - metahub-logs:/app/.logs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  control-api:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    image: ${METAHUB_IMAGE_PREFIX:-metahub}/control-api:${METAHUB_IMAGE_TAG:-local}
    command: ["python", "-m", "metahub_control.main"]
    env_file:
      - "${METAHUB_COMPOSE_ENV_FILE:-.env.compose}"
    environment:
      # Control 的会话风险人工处置与 Gateway 共用 Redis Store 合同；三个源码根目录必须
      # 同时存在，否则容器会在导入 metahub_gateway.session_risk 时启动失败。
      PYTHONPATH: /app/shared-sdk/python:/app/gateway-data-plane/src:/app/control-plane-api/src
      METAHUB_SERVICE_NAME: metahub-control-api
    ports:
      - "${METAHUB_CONTROL_BIND:-127.0.0.1}:${METAHUB_CONTROL_PORT:-8001}:8001"
    volumes:
      - metahub-sqlite:/app/.data/compose
      - metahub-logs:/app/.logs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  batch-worker:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    image: ${METAHUB_IMAGE_PREFIX:-metahub}/control-api:${METAHUB_IMAGE_TAG:-local}
    command: ["python", "-m", "metahub_control.batch_jobs.worker_main"]
    environment:
      PYTHONPATH: /app/shared-sdk/python:/app/gateway-data-plane/src:/app/control-plane-api/src
      METAHUB_SERVICE_NAME: batch-worker
      METAHUB_ENV: ${METAHUB_ENV:-dev}
      METAHUB_LOG_LEVEL: ${METAHUB_LOG_LEVEL:-INFO}
      METAHUB_DATABASE_URL: ${METAHUB_DATABASE_URL:?set METAHUB_DATABASE_URL in .env.compose}
      METAHUB_GATEWAY_API_BASE_URL: ${METAHUB_GATEWAY_API_BASE_URL:-http://gateway:8000}
      METAHUB_INTERNAL_BATCH_TOKEN: ${METAHUB_INTERNAL_BATCH_TOKEN:?set METAHUB_INTERNAL_BATCH_TOKEN in .env.compose}
      METAHUB_BATCH_ENCRYPTION_SECRET: ${METAHUB_BATCH_ENCRYPTION_SECRET:?set METAHUB_BATCH_ENCRYPTION_SECRET in .env.compose}
      METAHUB_FILE_ENCRYPTION_SECRET: ${METAHUB_FILE_ENCRYPTION_SECRET:?set METAHUB_FILE_ENCRYPTION_SECRET in .env.compose}
      METAHUB_FILE_STORAGE_ROOT: ${METAHUB_FILE_STORAGE_ROOT:-.data/compose/file-storage}
      METAHUB_BATCH_WORKER_ENABLED: ${METAHUB_BATCH_WORKER_ENABLED:-true}
      METAHUB_BATCH_POLL_INTERVAL_SECONDS: ${METAHUB_BATCH_POLL_INTERVAL_SECONDS:-1}
      METAHUB_BATCH_GLOBAL_CONCURRENCY: ${METAHUB_BATCH_GLOBAL_CONCURRENCY:-2}
      METAHUB_BATCH_TENANT_CONCURRENCY: ${METAHUB_BATCH_TENANT_CONCURRENCY:-1}
      METAHUB_BATCH_LEASE_SECONDS: ${METAHUB_BATCH_LEASE_SECONDS:-90}
      METAHUB_BATCH_HEARTBEAT_SECONDS: ${METAHUB_BATCH_HEARTBEAT_SECONDS:-30}
    volumes:
      - metahub-sqlite:/app/.data/compose
      - metahub-logs:/app/.logs
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      gateway:
        condition: service_healthy
      control-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: unless-stopped

  console:
    build:
      context: ../..
      dockerfile: infra/docker/console.Dockerfile
    image: ${METAHUB_IMAGE_PREFIX:-metahub}/console:${METAHUB_IMAGE_TAG:-local}
    environment:
      METAHUB_CONSOLE_PORT: "5173"
    ports:
      - "${METAHUB_CONSOLE_BIND:-127.0.0.1}:${METAHUB_CONSOLE_PORT:-5173}:5173"
    depends_on:
      gateway:
        condition: service_started
      control-api:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["compose-full"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${METAHUB_REDIS_BIND:-127.0.0.1}:${METAHUB_REDIS_PORT:-6379}:6379"
    volumes:
      - metahub-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["compose-full"]
    environment:
      POSTGRES_DB: ${METAHUB_POSTGRES_DB:-metahub}
      POSTGRES_USER: ${METAHUB_POSTGRES_USER:-metahub}
      POSTGRES_PASSWORD: ${METAHUB_POSTGRES_PASSWORD:?set METAHUB_POSTGRES_PASSWORD in .env.compose}
    ports:
      - "${METAHUB_POSTGRES_BIND:-127.0.0.1}:${METAHUB_POSTGRES_PORT:-5432}:5432"
    volumes:
      - metahub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2026-07-02T15-40-28Z
    profiles: ["compose-full"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${METAHUB_MINIO_ACCESS_KEY:?set METAHUB_MINIO_ACCESS_KEY in .env.compose}
      MINIO_ROOT_PASSWORD: ${METAHUB_MINIO_SECRET_KEY:?set METAHUB_MINIO_SECRET_KEY in .env.compose}
    ports:
      - "${METAHUB_MINIO_BIND:-127.0.0.1}:${METAHUB_MINIO_PORT:-9000}:9000"
      - "${METAHUB_MINIO_CONSOLE_BIND:-127.0.0.1}:${METAHUB_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - metahub-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  metahub-sqlite:
  metahub-logs:
  metahub-redis:
  metahub-postgres:
  metahub-minio:
