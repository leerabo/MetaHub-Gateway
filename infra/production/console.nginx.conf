worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/retired-console-routes.conf;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    sendfile on;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        client_max_body_size 32m;
        proxy_ssl_trusted_certificate /run/tls/ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_next_upstream off;
        location ~* ^/(internal(?:/|$)|docs(?:/|$)|openapi\.json$|redoc(?:/|$)) { return 404; }
        # These stable URLs change between signed releases. Revalidate them on
        # navigation so browsers never combine new HTML with cached old modules
        # or styles. Keep validators and inherited security headers on 304s.
        location = / { expires -1; try_files /index.html =404; }
        location ~ ^/(index|console|identity|platform|privacy|partner|status)\.html$ { expires -1; try_files $uri =404; }
        location /assets/ { expires -1; try_files $uri =404; }
        location /src/ { expires -1; try_files $uri =404; }
        location = /production-assets.json { expires -1; try_files $uri =404; }
        location /v1/ { proxy_pass https://gateway:8000; }
        location / {
            if ($metahub_retired_console_route) { return 404; }
            proxy_pass https://control-api:8001;
        }
        location ~ (^/\.|\.map$|/tests/|/scripts/|package\.json$) { return 404; }
    }
}
