# No non-TLS TCP clients or network access to the superuser.
local all all peer map=metahub_local
hostnossl all all 0.0.0.0/0 reject
hostnossl all all ::/0 reject
hostssl metahub metahub 0.0.0.0/0 scram-sha-256
hostssl metahub metahub ::/0 scram-sha-256
# The app role may verify only strictly named isolated recovery databases.
# Other databases and network superuser access remain denied by default.
hostssl "/^restore_[0-9]{8}_[0-9]{6}_[0-9a-f]{12}$" metahub 0.0.0.0/0 scram-sha-256
hostssl "/^restore_[0-9]{8}_[0-9]{6}_[0-9a-f]{12}$" metahub ::/0 scram-sha-256
